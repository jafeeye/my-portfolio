services:
## Traefik 反向代理
  traefik:
    container_name: traefik
    image: traefik:latest
    dns:
      - 192.168.10.2
    environment:
      - DOCKER_API_VERSION=1.41
      - LEGO_CA_CERTIFICATES=/etc/ssl/certs/caddy-root.crt
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"   # 測試階段先用這個讓 dashboard 直接開;正式環境建議改用 labels + auth 保護
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--certificatesresolvers.internal.acme.caserver=https://acme-ca.test:9000/acme/local/directory"
      - "--certificatesresolvers.internal.acme.email=you@example.com"
      - "--certificatesresolvers.internal.acme.storage=/etc/traefik/acme.json"
      - "--certificatesresolvers.internal.acme.httpchallenge.entrypoint=web"
      # - "--serversTransport.insecureSkipVerify=true"
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"   # Traefik dashboard,改成沒被佔用的 port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs:/certs:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/ca/root.crt:/etc/ssl/certs/caddy-root.crt:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
    restart: unless-stopped

## traefik manager
  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - COOKIE_SECURE=false
    volumes:
      - ./traefik/dynamic/dynamic.yml:/app/config/dynamic.yml
      - ./traefik/acme.json:/app/acme.json:ro
      - ./traefik-manager/config:/app/config
      - ./traefik-manager/backups:/app/backups

## Obsidian 網頁版
  ignis:
    container_name: ignis
    image: nobbe/ignis:latest
    ports:
      - "8080:8080"
    environment:
    # match these to your host user (run: id)
      - PUID=1000
      - PGID=1000
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.ignis.rule=Host(`ignis.test`)
      - traefik.http.routers.ignis.entrypoints=websecure
      - traefik.http.routers.ignis.tls=true
      - traefik.http.routers.ignis.tls.certresolver=internal
      - traefik.http.services.ignis.loadbalancer.server.port=8080
## pingvin
  pingvin-share:
    container_name: pingvin-share-x
    image: smp46/pingvin-share-x
    ports:
      - "3000:3000"
    environment:
      - TRUST_PROXY=true # Set to true if a reverse proxy is in front of the container
    volumes:
      - ./pingvin-data:/opt/app/backend/data:rw,z
      - ./pingvin-data/images:/opt/app/frontend/public/img:rw,z
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.pingvin.rule=Host(`pingvin.test`)
      - traefik.http.routers.pingvin.entrypoints=websecure
      - traefik.http.routers.pingvin.tls=true
      - traefik.http.routers.pingvin.tls.certresolver=internal
      - traefik.http.services.pingvin.loadbalancer.server.port=3000

## baidunetdisk
  baidunetdisk:
    container_name: baidunetdisk
    image: johngong/baidunetdisk:latest
    ports:
      - "5800:5800"
      - "5900:5900"
    volumes:
      - ./baidunetdisk/config:/config
      - ./baidunetdisk/download:/config/baidunetdiskdownload
    restart: unless-stopped

## filebot
  filebot:
    container_name: filebot
    image: jlesage/filebot
    ports:
      - "7000:7000"
    volumes:
      - ./filebot-data:/config:rw
      - ./file-data/user:/storage:rw
    restart: unless-stopped

## copyparty
  copyparty:
    container_name: copyparty
    image: copyparty/ac:latest
    ports:
      - "3923:3923"
    volumes:
      - ./copyparty/config:/cfg
      - ./copyparty/data:/w
    restart: unless-stopped

## mailhog
  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailhog.rule=Host(`mailhog.test`)
      - traefik.http.routers.mailhog.entrypoints=websecure
      - traefik.http.routers.mailhog.tls=true
      - traefik.http.routers.mailhog.tls.certresolver=internal
      - traefik.http.services.mailhog.loadbalancer.server.port=8025

## librespeed 測速
  librespeed:
    container_name: librespeed
    image: ghcr.io/librespeed/speedtest:latest
    ports:
      - "8880:80"
    environment:
      - MODE=standalone
      - TITLE=LibreSpeed
      - TELEMETRY=false
    volumes:
      - ./librespeed/data:/database
    restart: unless-stopped

## home assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./homeassistant/config:/config
    restart: unless-stopped

## scrutiny 硬碟健康監控
  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    ports:
      - "8081:8080"   # web UI(改成 8081,因為 8080 被 ignis 用了)
      - "8086:8086"   # 內建 InfluxDB
    volumes:
      - /run/udev:/run/udev:ro
      - ./scrutiny/config:/opt/scrutiny/config
      - ./scrutiny/influxdb:/opt/scrutiny/influxdb
    restart: unless-stopped

## mkcert
  mkcert:
    image: dcagatay/mkcert:latest
    container_name: mkcert
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./certs:/certs
    # 把下面的網域改成你自己的（可加多個，用空白隔開）
    # 例如：authentik.home.local proxmox.home.local "*.home.local"
    #command: >
    #  authentik.home.local
    #  proxmox.home.local
    #  "*.home.local"

## bujic-panel
  bujic-panel:
    image: crpi-a1liy20beodq2bdl.cn-beijing.personal.cr.aliyuncs.com/bujic/bujic-panel:latest
    container_name: bujic-panel
    restart: unless-stopped
    ports:
      - "5500:3000"
    volumes:
      - ./bujic-panel-data:/app/data
    environment:
      - DATA_DIR=/app/data
      #- ENCRYPT_KEY=your_64_hex_chars_here  # 生产必填，见下方说明
    labels:
      - traefik.enable=true
      - traefik.http.routers.bujic-panel.rule=Host(`panel.test`)
      - traefik.http.routers.bujic-panel.entrypoints=websecure
      - traefik.http.routers.bujic-panel.tls=true
      - traefik.http.routers.bujic-panel.tls.certresolver=internal
      - traefik.http.services.bujic-panel.loadbalancer.server.port=3000
      
## dbx
  dbx:
    image: t8y2/dbx:latest
    # For faster pulls in China, use the CNB image instead:
    # image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: always
    ports:
      - "4224:4224"
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped

## vcompose
  vcompose:
    image: ghcr.io/zbrave/vcompose:latest
    container_name: vcompose
    restart: unless-stopped
    ports:
      - "7482:80"

## neko
  neko-master:
    image: foru17/neko-master:latest
    container_name: neko-master
    restart: unless-stopped
    ports:
      - "3200:3000" # Web UI
    volumes:
      - ./data:/app/data
      # Local MMDB (optional, files should be downloaded into ./geoip)
      - ./geoip:/app/data/geoip:ro
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/stats.db
      - COOKIE_SECRET=${COOKIE_SECRET}
    
volumes:
  obsidian-app:
  dbx-data: